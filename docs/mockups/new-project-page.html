<meta charset="utf-8">
<title>New Project Page</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FBFAF7; --surface:#FFFFFF; --surface-2:#F4F2EC; --surface-3:#EDEAE1;
  --line:#E4E1D8; --line-2:#CFCBBE;
  --ink:#17171C; --ink-2:#55535C; --ink-3:#7A7880;
  --run:#0E6E74;  --run-soft:#0E6E7414;
  --wait:#A35A00; --wait-soft:#A35A0014;
  --fail:#B0231B;
  --done:#B8B4A8; --pend:#EAE7DE;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
  --t:150ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--run);outline-offset:-2px}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.sans{font-family:var(--sans)}
.sp{flex:1}
.act{border:1px solid var(--line-2);padding:4px 12px;font-size:12px;white-space:nowrap;transition:background var(--t),border-color var(--t),color var(--t)}
.act:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink-3)}
.act:disabled{opacity:.4}
.act.primary{border-color:var(--run);color:var(--run);background:var(--run-soft);font-weight:500}
.act.primary:hover:not(:disabled){background:var(--run);color:#fff}
.link{color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;font-size:12px}
.link:hover{color:var(--ink)}
.soon{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px dashed var(--line-2);padding:0 5px;white-space:nowrap}

.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:600;white-space:nowrap}
.brand em{font-style:normal;color:var(--line-2);padding:0 .35em}
.brand span{color:var(--ink-2);font-weight:400}
.doc{max-width:860px;margin:0 auto;padding:28px 18px 80px}
.doc > h1{font-family:var(--sans);font-size:22px;font-weight:600;margin:0 0 4px}
.doc > p{font-family:var(--sans);color:var(--ink-2);margin:0 0 22px;max-width:66ch}

/* the transcript: answered steps are one line, the open one is a panel, later ones wait */
.sec{border-top:1px solid var(--line)}
.sec:last-child{border-bottom:1px solid var(--line)}
.line{display:grid;grid-template-columns:34px 120px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 4px}
.line .no{color:var(--ink-3)}
.line .k{color:var(--ink-3)}
.line .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .v b{font-weight:600}
.sec.later .line{color:var(--done)}
.sec.later .line .k,.sec.later .line .no{color:var(--done)}
.sec.open{background:var(--surface);border:1px solid var(--line-2);border-left:3px solid var(--run);margin:6px 0}
.sec.open + .sec{border-top:0}
.sec.open .line .no,.sec.open .line .k{color:var(--run)}
.sec.open .line .v{font-family:var(--sans);font-size:16px;font-weight:600;white-space:normal}
.panel{padding:2px 16px 18px 50px}
.panel > p{font-family:var(--sans);color:var(--ink-2);margin:0 0 12px;max-width:62ch}

.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.choice{border:1px solid var(--line-2);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-height:76px;transition:border-color var(--t)}
.choice b{display:flex;gap:8px;align-items:center;justify-content:space-between}
.choice small{font-family:var(--sans);font-size:12px;color:var(--ink-2)}
.choice:not(:disabled):hover{border-color:var(--ink-3)}
.choice[aria-pressed="true"]{border-color:var(--run);box-shadow:inset 0 0 0 1px var(--run);background:var(--run-soft)}
.choice:disabled{border-style:dashed;color:var(--ink-3)}
.choice:disabled small{color:var(--ink-3)}

.gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ok{color:var(--run)}
.tabs{display:flex;border-bottom:1px solid var(--line-2);margin-bottom:8px;gap:2px;flex-wrap:wrap}
.tab{padding:6px 12px;font-size:12px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--run)}
.tab small{color:var(--ink-3);margin-left:4px}
.search{width:100%;border:1px solid var(--line-2);padding:6px 9px;background:var(--paper);border-radius:0;margin-bottom:8px}
.rlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.rr{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:0 8px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line)}
.rr input{accent-color:var(--run);margin:0;transform:translateY(2px)}
.rr small{grid-column:2 / 4;font-family:var(--sans);font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .meta{font-size:11px;color:var(--ink-3)}
.rr.taken{color:var(--ink-3)}
.rr.taken small{color:var(--wait)}
label.rr{cursor:pointer}
label.rr:hover{background:var(--surface-2)}

.pathrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.path{flex:1;min-width:240px;border:1px solid var(--line-2);padding:7px 10px;background:var(--paper);border-radius:0;font-size:14px}
.note{font-size:12px;color:var(--ink-3);margin:0 0 12px}
.warn{border-left:3px solid var(--wait);background:var(--wait-soft);color:var(--wait);padding:6px 10px;font-size:12px;margin:0 0 12px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);margin-bottom:14px}
.facts div{padding:8px 10px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term{background:var(--ink);color:#E9E6DD;padding:12px 14px;font-size:12px;min-height:150px;max-height:260px;overflow:auto;white-space:pre-wrap;margin-top:12px}
.term .cmd{color:#9C998F}
.term .fb{color:#8FD3D6}
.ready{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1px solid var(--line-2);border-left:3px solid var(--run)}
.ready b{font-family:var(--sans);font-size:15px}

@media (max-width:720px){
  .line{grid-template-columns:26px 1fr auto}
  .line .k{display:none}
  .panel{padding-left:16px}
  .rlist{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
  .facts div{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){
  *,*::after,*::before{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>

<header class="topbar">
  <div class="brand">flowboard<em>/</em><span>projects</span><em>/</em><span>new</span></div>
  <span class="sp"></span>
  <button class="act">Cancel</button>
</header>
<main class="doc">
  <h1>New project</h1>
  <p>Four answers, each on its own line once given. Nothing is cloned until the last one; change any answer above and the ones after it are asked again.</p>
  <div id="steps"></div>
</main>

<script>
const ICON = {
  code: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>',
  book: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5A2.5 2.5 0 0 0 4 21.5"/><path d="M8 7h8"/></svg>',
  pen:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  data: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
  branch: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-6 3-11 6"/></svg>',
  folder: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>',
  check: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 8.3l3.1 3.1 6.1-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

/* What FlowBoard can make and where code can come from. Only the first of each is wired up. */
const TYPES = [
  { id: 'software', name: 'Software', icon: ICON.code, text: 'A codebase agents read, change and test. Flows run steps against a clone of the repo.' },
  { id: 'research', name: 'Research', icon: ICON.book, text: 'Questions answered from sources, with citations kept as artifacts.', soon: true },
  { id: 'writing', name: 'Writing', icon: ICON.pen, text: 'Docs and long-form text drafted, reviewed and edited by steps.', soon: true },
  { id: 'data', name: 'Data', icon: ICON.data, text: 'Notebooks and pipelines, checked by running them.', soon: true },
];
const SOURCES = [
  { id: 'github', name: 'GitHub', text: 'github.com, personal accounts and organizations' },
  { id: 'gitlab', name: 'GitLab', text: 'gitlab.com and self-managed', soon: true },
  { id: 'bitbucket', name: 'Bitbucket', text: 'Bitbucket Cloud', soon: true },
  { id: 'azure', name: 'Azure Repos', text: 'Azure DevOps', soon: true },
  { id: 'local', name: 'A folder on this machine', text: 'a git repository you already cloned', soon: true },
];
/* Repos the connected GitHub account can read. `taken`: already a FlowBoard project. `exists`: the default folder is in use. */
const REPOS = [
  { owner: 'flowboard', name: 'api', text: 'REST handlers and the board projection', lang: 'TypeScript', pushed: '2 h ago', branch: 'main', mb: 48, objects: 18342, priv: true, check: 'pnpm lint && pnpm test', from: 'package.json + pnpm-lock.yaml' },
  { owner: 'flowboard', name: 'runner', text: 'Runs one flow step in its sandbox', lang: 'TypeScript', pushed: 'yesterday', branch: 'main', mb: 31, objects: 9021, priv: true, check: 'pnpm test', from: 'package.json + pnpm-lock.yaml' },
  { owner: 'flowboard', name: 'core', text: 'Engine, flow graph, guards', lang: 'TypeScript', pushed: '5 h ago', branch: 'main', mb: 12, objects: 4410, priv: true, taken: 'Core' },
  { owner: 'flowboard', name: 'web', text: 'The Next.js app: board, inbox, designer', lang: 'TypeScript', pushed: '3 d ago', branch: 'main', mb: 112, objects: 40211, priv: true, exists: true, check: 'pnpm lint && pnpm test', from: 'package.json + pnpm-lock.yaml' },
  { owner: 'flowboard', name: 'providers', text: 'Claude Code and OpenCode adapters', lang: 'TypeScript', pushed: '6 d ago', branch: 'main', mb: 9, objects: 3120, priv: false, check: 'pnpm test', from: 'package.json + pnpm-lock.yaml' },
  { owner: 'flowboard', name: 'docs', text: 'The FlowBoard vault', lang: 'Markdown', pushed: '1 h ago', branch: 'main', mb: 21, objects: 6600, priv: false, check: null },
  { owner: 'alex', name: 'billing-svc', text: 'Invoices, dunning and the Stripe webhook', lang: 'Go', pushed: '4 d ago', branch: 'trunk', mb: 27, objects: 7702, priv: true, check: 'go vet ./... && go test ./...', from: 'go.mod' },
  { owner: 'alex', name: 'dotfiles', text: 'zsh, tmux, nvim', lang: 'Shell', pushed: '2 mo ago', branch: 'main', mb: 1, objects: 380, priv: false, check: null },
  { owner: 'clearcloud-labs', name: 'ingest-pipeline', text: 'Nightly import of partner feeds', lang: 'Python', pushed: '9 d ago', branch: 'develop', mb: 64, objects: 12890, priv: true, check: 'uv run pytest', from: 'pyproject.toml + uv.lock' },
  { owner: 'clearcloud-labs', name: 'ops-runbooks', text: 'On-call runbooks', lang: 'Markdown', pushed: '1 mo ago', branch: 'main', mb: 3, objects: 900, priv: true, check: null },
];
const OWNERS = ['alex', 'flowboard', 'clearcloud-labs'];
const HOME = '~/FlowBoard/projects';


/* Opens mid-flight: Software and GitHub answered, the account connected, choosing among alex's repositories. */
const st = { open: 2, type: 'software', source: 'github', gh: 'connected', owner: 'alex', q: '', repo: 'alex/billing-svc', path: null, clone: null };
const $ = (id) => document.getElementById(id);
const repo = () => REPOS.find((r) => `${r.owner}/${r.name}` === st.repo);
const defaultPath = () => `${HOME}/${repo().name}${repo().exists ? '-2' : ''}`;
const path = () => st.path ?? defaultPath();
const pathOk = () => /^(~\/|\/)[^\s]+$/.test(path().trim());

const STEPS = [
  { k: 'type', q: () => 'What kind of project is it?', a: () => TYPES.find((t) => t.id === st.type)?.name, panel: typePanel },
  { k: 'source', q: () => 'Where does the code live?', a: () => SOURCES.find((s) => s.id === st.source)?.name, panel: sourcePanel },
  { k: 'repository', q: () => (st.gh === 'connected' ? 'Which repository?' : 'Connect GitHub'), a: () => st.repo && `<b>${st.repo}</b> <span style="color:var(--ink-3)">· ${repo().branch} · ${repo().lang}</span>`, panel: repoPanel },
  { k: 'clone into', q: () => 'Where should the clone go?', a: () => st.clone?.done && `<b>${path()}</b>`, panel: clonePanel },
];

function render() {
  $('steps').innerHTML = STEPS.map((s, i) => {
    if (i === st.open) {
      return `<section class="sec open" aria-current="step"><div class="line"><span class="no">0${i + 1}</span><span class="k">${s.k}</span><span class="v">${s.q()}</span><span></span></div><div class="panel">${s.panel()}</div></section>`;
    }
    const done = i < st.open || (i === 3 && st.clone?.done);
    const a = done ? s.a() : '';
    return `<section class="sec ${done ? '' : 'later'}"><div class="line"><span class="no">0${i + 1}</span><span class="k">${s.k}</span>
      <span class="v">${done ? `<span class="ok">›</span> ${a}` : s.q()}</span>${done && !st.clone ? `<button class="link" data-open="${i}">change</button>` : '<span></span>'}</div></section>`;
  }).join('');
}

function typePanel() {
  return `<div class="choices">${TYPES.map((t) => `<button class="choice" data-type="${t.id}" aria-pressed="${st.type === t.id}" ${t.soon ? 'disabled' : ''}><b>${t.name}${t.soon ? '<span class="soon">soon</span>' : ''}</b><small>${t.text}</small></button>`).join('')}</div>`;
}
function sourcePanel() {
  return `<p>FlowBoard clones the repository onto this machine and does every fetch and push itself; agents only see the clone.</p>
    <div class="choices">${SOURCES.map((s) => `<button class="choice" data-src="${s.id}" aria-pressed="${st.source === s.id}" ${s.soon ? 'disabled' : ''}><b>${s.name}${s.soon ? '<span class="soon">soon</span>' : ''}</b><small>${s.text}</small></button>`).join('')}</div>`;
}
function repoPanel() {
  if (st.gh !== 'connected') {
    const waiting = st.gh === 'waiting';
    return `<p>FlowBoard needs to read your repositories, and to push the <code>fb/task-*</code> branches it makes when you ask it to. The token stays in this machine's keychain; agents never get it.</p>
      <div class="gh"><button class="act primary" data-connect ${waiting ? 'disabled' : ''}>${waiting ? 'Waiting for github.com…' : 'Connect GitHub'}</button><span class="note" style="margin:0">${waiting ? 'approve FlowBoard in the tab that opened' : 'opens github.com in a new tab'}</span></div>`;
  }
  const q = st.q.trim().toLowerCase();
  const list = REPOS.filter((r) => r.owner === st.owner && (!q || `${r.name} ${r.text}`.toLowerCase().includes(q)));
  return `<div class="gh"><span class="ok">${ICON.check}</span><span>GitHub connected as <b>alex</b></span><button class="link" data-disconnect>use another account</button></div>
    <div class="tabs" role="tablist">${OWNERS.map((o) => `<button class="tab" role="tab" data-owner="${o}" aria-selected="${st.owner === o}">${o}<small>${REPOS.filter((r) => r.owner === o).length}</small></button>`).join('')}</div>
    <input class="search" id="q" value="${st.q}" placeholder="Filter…" aria-label="Filter repositories" autocomplete="off">
    <div class="rlist" role="radiogroup" aria-label="Repositories">${
      list.map((r) => {
        const id = `${r.owner}/${r.name}`;
        return r.taken
          ? `<div class="rr taken"><span></span><b>${r.name}</b><span class="meta">${r.lang}</span><small>already the project ${r.taken}</small></div>`
          : `<label class="rr"><input type="radio" name="repo" value="${id}" ${st.repo === id ? 'checked' : ''}><b>${r.name}</b><span class="meta">${r.lang} · ${r.pushed}</span><small>${r.text}</small></label>`;
      }).join('') || `<p class="note">Nothing in ${st.owner} matches “${st.q}”.</p>`
    }</div>
    <div class="gh" style="margin:14px 0 0"><button class="act primary" data-next ${st.repo ? '' : 'disabled'}>Use ${st.repo ?? 'this repository'}</button></div>`;
}
function clonePanel() {
  const r = repo();
  if (st.clone) {
    const c = st.clone;
    return `<div class="facts"><div><span class="lbl">from</span><b>github.com/${st.repo}</b></div><div><span class="lbl">into</span><b>${path()}</b></div><div><span class="lbl">branch</span><b>${r.branch}</b></div></div>
      <div class="lbl">${c.done ? 'done' : `${c.phase} · ${Math.round(c.pct)}%`}</div>
      <div class="term" aria-live="polite">${c.lines.join('\n')}</div>
      ${c.done ? `<div class="ready"><b>${r.name} is ready</b><span class="note" style="margin:0">${r.check ? `check command ${r.check}` : 'no check command found; set one on the project page'} · default flow delivery</span><span class="sp"></span><button class="act" data-again>Another</button><button class="act primary">Open ${r.name}</button></div>` : ''}`;
  }
  return `<div class="pathrow"><input class="path" id="path" value="${path()}" spellcheck="false" aria-label="Clone into">${st.path !== null ? `<button class="link" data-reset>back to ${defaultPath()}</button>` : ''}</div>
    <p class="note">${st.path === null ? `FlowBoard's projects folder; change it here, or for every project in Settings` : 'a folder that does not exist yet, or an empty one'}</p>
    ${r.exists && st.path === null ? `<p class="warn">${HOME}/${r.name} already holds another clone, so this one gets the -2.</p>` : ''}
    ${pathOk() ? '' : '<p class="warn">a folder path: absolute, or starting with ~/</p>'}
    <div class="facts"><div><span class="lbl">from</span><b>github.com/${st.repo}</b></div><div><span class="lbl">branch</span><b>${r.branch}, the base branch</b></div><div><span class="lbl">size</span><b>about ${r.mb} MB</b></div></div>
    <button class="act primary" data-clone ${pathOk() ? '' : 'disabled'}>Clone and create project</button>`;
}

function startClone() {
  const r = repo();
  st.clone = { pct: 0, phase: 'receiving objects', done: false, lines: [`<span class="cmd">$ git clone https://github.com/${st.repo}.git ${path()}</span>`, `Cloning into '${path()}'...`, `remote: Enumerating objects: ${r.objects}, done.`] };
  const c = st.clone;
  const tick = () => {
    if (st.clone !== c) return;
    c.pct = Math.min(100, c.pct + 4 + Math.random() * 7);
    const line = `Receiving objects: ${String(Math.round(c.pct)).padStart(3)}% (${Math.round((r.objects * c.pct) / 100)}/${r.objects}), ${((r.mb * c.pct) / 100).toFixed(2)} MiB | 14.20 MiB/s`;
    if (c.lines.at(-1).startsWith('Receiving')) c.lines[c.lines.length - 1] = line;
    else c.lines.push(line);
    render();
    if (c.pct < 100) return setTimeout(tick, 140);
    c.lines[c.lines.length - 1] += ', done.';
    c.phase = 'setting up';
    const after = [
      `Resolving deltas: 100% (${Math.round(r.objects * 0.52)}/${Math.round(r.objects * 0.52)}), done.`,
      `<span class="fb">-- base branch ${r.branch}; worktrees branch from it</span>`,
      `<span class="fb">-- added .flowboard/ to .git/info/exclude</span>`,
      r.check ? `<span class="fb">-- found ${r.from}: check command ${r.check}</span>` : `<span class="fb">-- no package manifest: no check command</span>`,
      `<span class="fb">-- project ${r.name} registered, flow delivery</span>`,
    ];
    let i = 0;
    const more = () => {
      if (st.clone !== c) return;
      if (i < after.length) return c.lines.push(after[i++]), render(), setTimeout(more, 380);
      c.done = true;
      render();
    };
    more();
  };
  render();
  setTimeout(tick, 300);
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button, input[type=radio]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.open !== undefined) st.open = Number(d.open);
