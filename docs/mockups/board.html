<meta charset="utf-8">
<title>Lamproom Board</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FBFAF7; --surface:#FFFFFF; --surface-2:#F4F2EC; --surface-3:#EDEAE1;
  --line:#E4E1D8; --line-2:#CFCBBE;
  --ink:#17171C; --ink-2:#55535C; --ink-3:#7A7880;
  --run:#0E6E74; --run-soft:#0E6E7414;
  --wait:#A35A00; --wait-soft:#A35A0014; --wait-wash:#F7EAD3; --wait-edge:#DCC49A;
  --wait-ink:#FDF6EA; --wait-ink-2:#F8E8D0;
  --fail:#B0231B; --fail-soft:#B0231B12; --fail-edge:#EBD0CC;
  --done:#B8B4A8; --pend:#EAE7DE;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
  --t:150ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--mono);
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
svg{flex:0 0 auto;display:block}
:focus-visible{outline:2px solid var(--run);outline-offset:-2px}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.sans{font-family:var(--sans)}
.sep{color:var(--line-2);padding:0 .45em}
.sp{flex:1}
.mute{color:var(--ink-3)}
.app{height:100dvh;display:flex;flex-direction:column}

/* ── topbar ───────────────────────────────────────────────────── */
.topbar{flex-shrink:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand em{font-style:normal;color:var(--line-2);padding:0 .35em}
.brand span{color:var(--ink-2);font-weight:400}
.brand b{font-weight:600}
.tcount{color:var(--ink-3);font-size:12px}
.wflink{font-size:12px;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2)}
.wflink:hover{color:var(--ink);border-color:var(--ink)}

/* ── buttons ──────────────────────────────────────────────────── */
.act{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);padding:3px 11px;
  font-size:12px;white-space:nowrap;background:var(--surface);
  transition:background var(--t),border-color var(--t),color var(--t)}
.act:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink-3)}
.act:disabled{opacity:.4;cursor:default}
.act.primary{border-color:var(--run);color:var(--run);background:var(--run-soft);font-weight:500}
.act.primary:hover:not(:disabled){background:var(--run);color:#fff}
.act.wait{border-color:var(--wait);color:var(--wait);background:var(--wait-soft);font-weight:500}
.act.wait:hover:not(:disabled){background:var(--wait);color:var(--wait-ink)}
.act kbd{font-family:var(--mono);font-size:10px;color:var(--ink-3);border:1px solid var(--line);padding:0 3px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  color:var(--ink-3);transition:color var(--t),background var(--t)}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}

/* ── source strip: where the issues live and whether they're in step ── */
.source{flex-shrink:0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 18px;
  background:var(--surface-3);border-top:2px solid var(--line-2);border-bottom:1px solid var(--line-2);font-size:12px}
.src-name{font-weight:600}
.src-where{color:var(--ink-2)}
.sync{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.sync.is-run{color:var(--run)}
.sync.is-fail{color:var(--fail);font-weight:500}
.sync.is-quiet{color:var(--ink-3)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.queue-btn{display:inline-flex;align-items:center;gap:6px;color:var(--ink);border-bottom:1px dashed var(--ink-3)}
.queue{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--line-2);padding:8px 18px 10px;font-size:11.5px}
.queue ol{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:3px}
.queue li{display:grid;grid-template-columns:62px 1fr;gap:10px;color:var(--ink-2)}
.queue code{font-family:var(--mono);color:var(--ink);overflow-wrap:anywhere}
.failnote{flex-shrink:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 18px;
  background:var(--fail-soft);border-bottom:1px solid var(--fail-edge);color:var(--fail);font-size:12px}
.failnote .sans{color:var(--ink)}

/* ── conflict zone: the one bold place ────────────────────────── */
.zone{flex-shrink:0;background:var(--wait-wash);padding-bottom:11px;max-height:34vh;overflow:auto}
.zone-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;
  background:var(--wait);color:var(--wait-ink);padding:7px 18px;margin-bottom:11px}
.zone-head .lbl{color:var(--wait-ink);font-weight:600;font-size:11px}
.zone-head .sans{color:var(--wait-ink-2);font-size:12px}
.ccard{margin:0 18px 8px;padding:10px 14px 12px;background:var(--surface);
  border:1px solid var(--wait-edge);border-left:3px solid var(--wait);display:grid;gap:8px}
.ccard-t{font-family:var(--sans);font-size:14px;font-weight:600}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side{padding:7px 10px;background:var(--surface-2);font-size:12px;display:grid;gap:3px}
.side .sans{color:var(--ink-2);font-size:12.5px}
.ccard-a{display:flex;gap:8px;flex-wrap:wrap}

/* ── body: board + panel ──────────────────────────────────────── */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.body.has-panel{grid-template-columns:minmax(0,1fr) 400px}
.board{min-height:0;overflow:auto;display:flex;gap:0;padding:0 0 0 6px}

.col{flex:1 1 226px;min-width:226px;max-width:360px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.col.is-over{background:var(--run-soft)}
.col.is-refuse{background:var(--fail-soft)}
.col-head{flex-shrink:0;padding:12px 12px 9px;position:sticky;top:0;background:var(--paper);z-index:1;border-bottom:1px solid var(--line)}
.col-name{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;padding-bottom:3px}
.col.is-cur .col-name{box-shadow:inset 0 -2px 0 var(--ink)}
.col-name .n{color:var(--ink-3);font-weight:400}
.col-name .lk{color:var(--ink-3)}
.col-who{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.col-means{font-family:var(--sans);font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.35}
.col-body{flex:1;padding:8px 8px 40px;display:flex;flex-direction:column;gap:7px}
.col-empty{font-size:11px;color:var(--ink-3);padding:10px 4px;border:1px dashed var(--line-2);text-align:center}
.col.is-agent,.col.is-agent .col-head{background:var(--surface-2)}
.col-who .tag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:0 5px;border:1px solid var(--line-2);color:var(--ink-2);margin-right:6px}
.agents{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.agents .w{color:var(--wait);font-weight:500}

/* ── a card ───────────────────────────────────────────────────── */
.kc{display:grid;gap:5px;width:100%;padding:8px 10px 9px;background:var(--surface);
  border:1px solid var(--line);transition:border-color var(--t),opacity var(--t),box-shadow var(--t)}
.kc:hover{border-color:var(--line-2)}
.kc.is-sel{box-shadow:inset 2px 0 0 var(--ink);border-color:var(--line-2)}
.kc.is-drag{opacity:.35}
.kc.is-pending{border-style:dashed;border-color:var(--ink-3)}
.kc.is-gate{border-color:var(--wait-edge);border-left:3px solid var(--wait)}
.kc.is-run{border-left:3px solid var(--run)}
.kc.is-done{background:transparent;color:var(--ink-3)}
.kc.is-new{animation:arrive .9s cubic-bezier(.4,0,.2,1)}
@keyframes arrive{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.kc-top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.kc-t{font-family:var(--sans);font-size:13px;font-weight:500;line-height:1.3}
.kc.is-done .kc-t{color:var(--ink-2)}
.kc-m{font-size:11px;color:var(--ink-3);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.kc-line{font-size:11px;display:flex;gap:6px;align-items:flex-start;color:var(--ink-2)}
.kc-line.run{color:var(--run)}
.kc-line.wait{color:var(--wait);font-weight:500}
.kc-line.pend{color:var(--ink-2)}
.kc-line.remote{color:var(--ink-2);background:var(--surface-2);padding:2px 6px;margin:0 -2px}
.kc-line.block{color:var(--ink-2)}
.kc-miss{font-family:var(--sans);font-size:11.5px;color:var(--ink-2);border-left:2px solid var(--line-2);padding-left:7px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:0 6px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2)}

/* the flow on a running card: one cell per step */
.kbar{display:flex;gap:2px}
.kseg{height:6px;flex:1;position:relative;overflow:hidden;background:var(--pend)}
.kseg.done{background:var(--done)}
.kseg.running{background:var(--run)}
.kseg.running::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
  transform:translateX(-100%);animation:sweep 1.9s cubic-bezier(.4,0,.2,1) infinite}
.kseg.hold{background:repeating-linear-gradient(45deg,var(--wait) 0 1.5px,transparent 1.5px 4px);box-shadow:inset 0 0 0 1px var(--wait)}
@keyframes sweep{to{transform:translateX(100%)}}

/* ── panel ────────────────────────────────────────────────────── */
.panel{min-height:0;overflow:auto;background:var(--surface);border-left:1px solid var(--line-2)}
.p-head{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.p-sec{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:7px}
.p-title{font-family:var(--sans);font-size:17px;font-weight:600;line-height:1.3;margin:0}
.p-body{font-family:var(--sans);font-size:13.5px;color:var(--ink-2);line-height:1.5;margin:0}
.p-kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:12px}
.p-kv dt{color:var(--ink-3)}
.p-kv dd{margin:0;overflow-wrap:anywhere}
.p-miss{margin:0;padding:0 0 0 16px;font-family:var(--sans);font-size:13px;color:var(--ink);display:grid;gap:4px}
.p-ask{font-family:var(--sans);font-size:13px;padding:7px 10px;background:var(--surface-2);border-left:2px solid var(--line-2)}
.p-acts{display:flex;gap:8px;flex-wrap:wrap}
.p-file{margin:0;padding:8px 10px;background:var(--surface-2);font-size:11.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.p-file mark{background:var(--run-soft);color:var(--ink);box-shadow:inset 2px 0 0 var(--run)}
.moves{display:flex;flex-wrap:wrap;gap:4px}
.mv{font-size:11px;padding:2px 7px;border:1px solid var(--line);color:var(--ink-2);transition:background var(--t),border-color var(--t)}
.mv:hover:not(:disabled){border-color:var(--ink-3);background:var(--surface-2)}
.mv[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);cursor:default}
.mv:disabled:not([aria-current="true"]){opacity:.35;cursor:default}
.hist{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:11.5px}
.hist li{display:grid;gap:2px}
.hist .h-w{color:var(--ink-3)}
.hist code{font-family:var(--mono);color:var(--ink-2);overflow-wrap:anywhere;font-size:11px}
.hist .h-q{color:var(--ink-2)}
.kids li{grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:start;font-family:var(--sans);font-size:12.5px}
.kids svg{margin-top:2px}
.why{font-size:11.5px;color:var(--ink-3);font-family:var(--sans)}

/* ── statusbar, toast, mockup controls ────────────────────────── */
.statusbar{flex-shrink:0;display:flex;align-items:center;flex-wrap:wrap;gap:0;
  padding:6px 18px;background:var(--surface-2);border-top:1px solid var(--line);color:var(--ink-3);font-size:11px}
.statusbar .w{color:var(--wait);font-weight:500}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:20;max-width:min(560px,92vw);
  padding:8px 14px;background:var(--ink);color:var(--surface);font-size:12px;opacity:0;transition:opacity var(--t);pointer-events:none}
.toast.on{opacity:1}
.mockctl{position:fixed;right:12px;bottom:38px;z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:6px 10px;background:var(--ink);color:var(--surface);font-size:11px;max-width:calc(100vw - 24px)}
.mockctl .lbl{color:var(--done)}
.mockctl button{text-decoration:underline;text-underline-offset:3px;color:var(--done)}
.mockctl button[aria-pressed="true"]{color:#fff;text-decoration:none;font-weight:600}

@media (max-width:900px){
  .body.has-panel{grid-template-columns:minmax(0,1fr)}
  .body.has-panel .board{display:none}
  .sides{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::after,*::before{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">lamproom<em>/</em><span>billing-svc</span><em>/</em><b>board</b></div>
    <span class="tcount" id="tcount"></span>
    <span class="sp"></span>
    <a class="wflink" href="workflows.html"><span class="mute">types</span> bug · task · story<span class="sep">·</span>workflows</a>
  </header>

  <div class="source" id="source"></div>
  <div id="queue"></div>
  <div id="failnote"></div>
  <section class="zone" id="zone" aria-label="Changed in both places" hidden></section>

  <div class="body" id="body">
    <main class="board" id="board" aria-label="Board"></main>
    <aside class="panel" id="panel" aria-label="Issue" hidden></aside>
  </div>

  <footer class="statusbar" id="statusbar"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="mockctl" id="mockctl" role="group" aria-label="Mockup controls"></div>

<script>
/* ── icons: house status marks + Lucide line icons (square caps, zero radius) ── */
const ICON = {
  run : '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.1" fill="currentColor"/><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".3"/></svg>',
  gate: '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><rect x="4.4" y="3.2" width="2.4" height="9.6" fill="currentColor"/><rect x="9.2" y="3.2" width="2.4" height="9.6" fill="currentColor"/></svg>',
  ask : '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.15 6.35a1.9 1.9 0 1 1 2.5 1.8c-.52.2-.72.58-.72 1.05v.35" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7.93" cy="11.5" r=".95" fill="currentColor"/></svg>',
  done: '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 8.3l3.1 3.1 6.1-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const luc = (d, s = 13) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">${d}</svg>`;
const LU = {
  sync : luc('<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>'),
  x    : luc('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 15),
  lock : luc('<rect width="18" height="11" x="3" y="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>', 11),
  up   : luc('<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>', 11),
  down : luc('<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>', 11),
  file : luc('<path d="M15 2H4v20h16V7Z"/><path d="M14 2v5h6"/><path d="M16 13H8"/><path d="M16 17H8"/>', 12),
  ban  : luc('<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>', 11),
  play : luc('<polygon points="6 3 20 12 6 21 6 3"/>', 11),
  search: luc('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>', 12),
  alert: luc('<path d="M12 3 2 21h20Z"/><path d="M12 9v5"/><path d="M12 17v.5"/>', 13),
  check: luc('<path d="M20 6 9 17l-5-5"/>', 13),
  layers: luc('<path d="m12 2 10 5-10 5L2 7Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>', 11),
  flow : luc('<rect width="8" height="8" x="3" y="3"/><path d="M7 11v4h6"/><rect width="8" height="8" x="13" y="13"/>', 12),
};
/* task types: told apart by shape, not colour — colour is kept for alive / wants you / broken */
const TY = {
  bug  : luc('<path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3 3 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/>', 12),
  task : luc('<rect width="18" height="18" x="3" y="3"/><path d="m9 12 2 2 4-4"/>', 12),
  story: luc('<path d="M12 7v14"/><path d="M3 18V3h6a3 3 0 0 1 3 3 3 3 0 0 1 3-3h6v15h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>', 12),
};

/* ── the columns. You manage five of them; agents manage the rest, which stay hidden until asked for. ── */
const COLS = [
  { id:'backlog',         owner:'you',   who:'you manage',                 means:'Parked. Nothing runs and nothing is spent until you move it on.' },
  { id:'needs-triage',    owner:'agent', who:'triage agent',               means:'New issues land here; the triage agent reads each one and decides what it is.' },
  { id:'needs-info',      owner:'agent', who:'triage agent → reporter',    means:'The agent asked whoever filed it for detail only they have.' },
  { id:'needs-context',   owner:'agent', who:'triage agent, repo-analyst', means:'The ask is clear, but the agent couldn’t find where in the code to start or which rule applies.' },
  { id:'ready-for-agent', owner:'you',   who:'you manage',                 means:'You want an agent on it. The triage agent checks it first; then Start run.' },
  { id:'ready-for-human', owner:'you',   who:'you manage',                 means:'Needs hands an agent shouldn’t have: secrets, production, a judgement call.' },
  { id:'in tasks',        owner:'tasks', who:'its tasks',                  means:'A story split into tasks. It moves to done by itself when its last task is.' },
  { id:'in progress',     owner:'agent', who:'the run',                    means:'A run is working through the flow. Cards come and go with the run.' },
  { id:'done',            owner:'you',   who:'you, or a finished run',     means:'Finished: a run landed it, or you closed it yourself.' },
  { id:'wontfix',         owner:'you',   who:'you manage',                 means:'Will not be actioned.' },
];
const COL = Object.fromEntries(COLS.map((c, i) => [c.id, { ...c, i }]));
const human = id => COL[id].owner === 'you';
const shown = id => COL[id].owner !== 'agent' || st.showAgent;

/* ── where issues live. The markdown file IS the board; the others are copies to keep in step. ── */
const PROV = {
  md: { name:'Markdown backlog', where:'BACKLOG.md in billing-svc', sync:false, short:'BACKLOG.md',
        id: c => '{#' + c.k + '}',
        loc: c => `BACKLOG.md:${mdLine(c)}`,
        cmd: (c, from, to) => `BACKLOG.md · moved “${c.title}” from ## ${from} to ## ${to}` },
  gh: { name:'GitHub Issues', where:'tallyhq/billing-svc', sync:true, short:'GitHub', syncCmd:'gh api · push labels, pull issues',
        id: c => '#' + c.gh,
        loc: c => `github.com/tallyhq/billing-svc/issues/${c.gh}`,
        cmd: (c, from, to) =>

/* ── state ── */
let st;
function load(prov) {
  const now = Date.now();
  st = { prov, cards: [], queue: [], sel: null, open: null, colCur: 0, showAgent: false,
         sync: { last: now - 4*M, state: 'ok', reject: false, inboundDone: false },
         conflicts: [], mdLast: now - 14*M };
  for (const s of SEED) {
    const c = { type: 'task', ...s, created: now - s.age, hist: [] };
    c.hist.push({ at: c.created, who: s.by, what: `opened in ${s.col === 'backlog' ? 'backlog' : 'needs-triage'}` });
    if (s.triage) c.triageAt = now + s.triage.in * SEC;
    if (s.runSeed) c.run = seedRun(s.runSeed, now);
    if (s.col === 'done') c.hist.push({ at: now - s.age + 3*H, who: 'lamproom', what: `run finished · $${s.spent.toFixed(2)}` });
    if (s.col === 'wontfix') c.hist.push({ at: now - 19*D, who: 'maria-k', what: 'closed as wontfix' });
    st.cards.push(c);
  }
  // the triage agent's last move hasn't gone out yet — on GitHub/Beads that sets up the conflict
  const wr = card('webhook-retry');
  if (PROV[prov].sync) enqueue(wr, 'needs-info', 'needs-context', now - 3*M, 'triage agent');
  else wr.hist.push({ at: now - 3*M, who: 'triage agent', what: 'needs-info → needs-context', cmd: PROV.md.cmd(wr, 'needs-info', 'needs-context') });
  st.sel = 'tax-breakdown';
}
function seedRun(r, now) {
  const steps = FLOW.map((f, i) => ({ state: i < r.step ? 'done' : i === r.step ? (r.gate ? 'hold' : 'running') : 'pending', ms: i < r.step ? f.dur * SEC : 0 }));
  if (r.gate) { steps[r.step].ms = FLOW[r.step].dur * SEC; }
  else steps[r.step].ms = r.into * SEC;
  return { id: r.id, steps, at: r.step, gateSince: r.gate ? now - r.waited : null, stepStart: now - (steps[r.step].ms) };
}
const card = k => st.cards.find(c => c.k === k);
const kids = s => st.cards.filter(c => c.parent === s.k);
const closed = c => c.col === 'done' || c.col === 'wontfix';
const P = () => PROV[st.prov];
const inCol = id => st.cards.filter(c => c.col === id);
const runCost = r => r ? r.steps.reduce((a, s, i) => a + (s.ms / M) * CLOCK * FLOW[i].rate, 0) : 0;

/* ── moving a card: the one rule set every path goes through (drag, keys, panel) ── */
/* you move cards between your five statuses, and out of an agent's; agents own the rest */
function canMove(c, to, who = 'you') {
  if (!c || c.col === to) return 'same';
  if (who !== 'you') return '';
  if (c.col === 'in tasks') return 'A story moves with its tasks: it goes to done by itself when the last one is.';
  if (to === 'in tasks') return 'Only a story goes in tasks, when you approve its split.';
  if (c.col === 'in progress') return `The run owns this card (${c.run ? c.run.id : ''}). Open it to approve, or cancel the run from the task.`;
  if (to === 'in progress') return 'Only a run puts a card in progress: open a ready-for-agent card and press Start run.';
  if (!human(to)) return `Agents set ${to}. Move the card to ready-for-agent; the triage agent flags it if something is missing.`;
  return '';
}
function move(c, to, who = 'you', silent) {
  const no = canMove(c, to, who);
  if (no) { if (no !== 'same' && !silent) toast(no); return false; }
  const from = c.col;
  c.col = to; c.agentNote = null;
  if (to !== 'needs-info') delete c.waitOn;
  delete c.checkAt;
  record(c, from, to, who);
  // a card you hand to the agents is read first, and may bounce to an agent status
  if (to === 'ready-for-agent') c.checkAt = Date.now() + 6*SEC;
  if (!silent) toast(P().sync ? `Moved to ${to} · queued for ${P().short}` : `Moved to ${to} · written to BACKLOG.md`);
  render();
  return true;
}
function agentMove(c, to, who, why) {
  const from = c.col;
  c.col = to; delete c.checkAt; delete c.triageAt;
  record(c, from, to, who);
  if (why) c.hist[c.hist.length - 1].note = why;
  c.agentNote = `${who}: ${from} → ${to}`; c.fresh = true;
  toast(`${who} moved ${P().id(c)} to ${to}${!shown(to) ? ' · hidden: press v to show agent statuses' : ''}`);
}
function record(c, from, to, who) {
  if (P().sync) enqueue(c, from, to, Date.now(), who);
  else { c.hist.push({ at: Date.now(), who, what: `${from} → ${to}`, cmd: P().cmd(c, from, to) }); st.mdLast = Date.now(); }
}
function enqueue(c, from, to, at, who) {
  // a second local move of the same card replaces the first: only the end state goes out
  const prev = st.queue.find(q => q.k === c.k);
  if (prev) { prev.to = to; prev.at = at; prev.who = who; prev.cmd = P().cmd(c, prev.from, to); }
  else st.queue.push({ k: c.k, from, to, at, who, cmd: P().cmd(c, from, to) });
  c.hist.push({ at, who, what: `${from} → ${to}`, cmd: P().cmd(c, from, to), pending: true });
}

/* ── sync: push the queue, pull what changed, stop on anything changed in both places ── */
function syncNow() {
  if (!P().sync || st.sync.state === 'syncing') return;
  st.sync.state = 'syncing'; render();
  setTimeout(() => {
    const now = Date.now();
    if (st.sync.reject) { st.sync.state = 'error'; render(); return; }
    const pulled = st.sync.inboundDone ? [] : INBOUND;
    st.sync.inboundDone = true;
    const clash = new Set();
    for (const ev of pulled) {
      if (ev.kind === 'new') {
        const c = { ...ev.card, created: now - ev.card.age, hist: [{ at: now - ev.card.age, who: ev.card.by, what: 'opened in needs-triage' }], fresh: true, remote: `new on ${P().short} · ${ev.card.by}`, triageAt: now + ev.card.triage.in * SEC };
        st.cards.push(c);
      } else {
        const c = card(ev.k), q = st.queue.find(x => x.k === ev.k);
        if (q) {   // it moved here too, and that hasn't gone out: don't guess, ask
          st.conflicts.push({ k: ev.k, mine: q.to, mineAt: q.at, mineWho: q.who, theirs: ev.to, who: ev.who, at: now - ev.ago, note: ev.note });
          clash.add(ev.k);
        } else {
          const from = c.col; c.col = ev.to;
          c.hist.push({ at: now - ev.ago, who: ev.who, what: `${from} → ${ev.to}`, remote: true });
          c.remote = `${ev.who} on ${P().short}: ${from} → ${ev.to}`; c.fresh = true;
        }
      }
    }
    let pushed = 0;
    st.queue = st.queue.filter(q => {
      if (clash.has(q.k)) return true;
      card(q.k).hist.forEach(h => { if (h.pending) h.pending = false; });
      pushed++;
      return false;
    });
    st.sync.last = now; st.sync.state = 'ok';
    toast(`Synced · ${pushed} pushed · ${pulled.length} pulled${clash.size ? ' · 1 needs you' : ''}`);
    render();
    setTimeout(() => { st.cards.forEach(c => c.fresh = false); }, 1200);
  }, 1400);
}
function resolve(k, keepMine) {
  const x = st.conflicts.find(c => c.k === k); if (!x) return;
  const c = card(k), q = st.queue.find(y => y.k === k);
  st.conflicts = st.conflicts.filter(y => y !== x);
  if (keepMine) {
    // yours goes out on the next sync, over theirs
    q.from = x.theirs; q.cmd = P().cmd(c, x.theirs, x.mine);
    c.hist.push({ at: x.at, who: x.who, what: `${q.from} (on ${P().short})`, remote: true, note: x.note });
    c.hist.push({ at: Date.now(), who: 'you', what: `kept ${x.mine} over ${x.who}’s change`, cmd: q.cmd, pending: true });
    toast(`Keeping ${x.mine} · goes out on the next sync${shown(x.mine) ? '' : ' · it sits in a hidden agent status'}`);
  } else {
    st.queue = st.queue.filter(y => y !== q);
    c.hist.forEach(h => { if (h.pending) { h.pending = false; h.what += ' (dropped)'; } });
    c.hist.push({ at: x.at, who: x.who, what: `→ ${x.theirs}`, remote: true, note: x.note });
    c.hist.push({ at: Date.now(), who: 'you', what: `took ${x.who}’s change, dropped the local one` });
    c.col = x.theirs;
    toast(`Took ${x.who}’s change · ${c.title.slice(0, 40)}… is ${x.theirs}`);
  }
  render();
}

/* ── runs: the smallest engine that walks the flow ── */
function startRun(c) {
  if (c.col !== 'ready-for-agent' || c.checkAt) return;
  if (st.prov === 'bd' && c.blockedBy && card('amount-minor').col !== 'done') { toast(`bd ready skips this: blocked by ${c.blockedBy}`); return; }
  const now = Date.now();
  c.run = { id: 'lr-04' + (13 + st.cards.filter(x => x.run).length), steps: FLOW.map(() => ({ state: 'pending', ms: 0 })), at: 0, stepStart: now };
  c.run.steps[0].state = 'running';
  const from = c.col; c.col = 'in progress';
  record(c, from, 'in progress', 'lamproom');
  toast(`Run ${c.run.id} started · ${FLOW[0].s} on ${FLOW[0].model}`);
  render();
}
function approve(c) {
  if (!c.run || c.run.steps[c.run.at].state !== 'hold') return;
  const r = c.run;
  r.steps[r.at].state = 'done'; r.at++; r.steps[r.at].state = 'running'; r.stepStart = Date.now(); r.gateSince = null;
  c.hist.push({ at: Date.now(), who: 'you', what: 'approved at review' });
  toast('Approved · summarize is running');
  render();
}
function tick() {
  const now = Date.now(); let changed = false;
  for (const s of inCol('in tasks')) { const k = kids(s);
    if (k.length && k.every(closed) && k.some(x => x.col === 'done')) { agentMove(s, 'done', 'lamproom', 'last task done'); changed = true; } }
  for (const c of st.cards) {
    const r = c.run; if (!r || c.col !== 'in progress') continue;
    const s = r.steps[r.at]; if (s.state !== 'running') continue;
    s.ms = now - r.stepStart;
    if (s.ms >= FLOW[r.at].dur * SEC) {
      s.ms = FLOW[r.at].dur * SEC;
      if (FLOW[r.at].gate) { s.state = 'hold'; r.gateSince = now; c.hist.push({ at: now, who: 'reviewer', what: 'review passed with notes · waiting on you' }); changed = true; continue; }
      s.state = 'done';
      if (r.at === FLOW.length - 1) {
        c.spent = runCost(r); c.col = 'done';
        c.hist.push({ at: now, who: 'lamproom', what: `run finished · $${c.spent.toFixed(2)}` });
        record(c, 'in progress', 'done', 'lamproom');
        toast(`${c.title} is done${P().sync ? ` · close queued for ${P().short}` : ' · moved to ## done in BACKLOG.md'}`);
      } else { r.at++; r.steps[r.at].state = 'running'; r.stepStart = now; }
      changed = true;
    }
  }
  for (const c of st.cards) if (c.analyst && !c.context && now - c.analyst >= 7*SEC) {
    c.context = { file: `.lamproom/context/${c.k}.md`, size: '2.3 kB',
      found: c.k === 'webhook-retry'
        ? ['ADR-0007 sets exponential backoff, 5 tries, 30s cap', 'src/jobs/queue.ts already retries jobs; stripe.ts acks before enqueueing']
        : ['packages/ledger/round.ts rounds half-even; checkout rounds half-up', 'plan change is the call site with tests (tests/ledger/prorate.test.ts)'] };
    c.hist.push({ at: now, who: 'repo-analyst', what: `attached ${c.context.file}`, cmd: P().sync ? (st.prov === 'gh' ? `gh issue comment ${c.gh} --body-file ${c.context.file}` : `bd comments add ${c.bd} -f ${c.context.file}`) : `BACKLOG.md · added “context: ${c.context.file}” under the item` });
    toast('repo-analyst attached context.md · read it, then move the card');
    changed = true;
  }
  // the triage agent: sorts new issues, and reads every card you hand to the agents
  for (const c of st.cards) {
    if (c.triageAt && now >= c.triageAt && c.col === 'needs-triage') {
      const t = c.triage;
      if (t.asked) { c.asked = t.asked; c.waitOn = c.by; c.waited = now; }
      agentMove(c, t.to, 'triage agent', t.why); changed = true;
    }
    if (c.checkAt && now >= c.checkAt && c.col === 'ready-for-agent') {
      if (c.checkFail) { c.missing = c.checkFail.missing; agentMove(c, c.checkFail.to, 'triage agent', c.checkFail.why); delete c.checkFail; }
      else { delete c.checkAt; c.hist.push({ at: now, who: 'triage agent', what: 'checked: nothing missing, ready to run' }); toast(`triage agent: ${P().id(c)} is ready to run`); }
      changed = true;
    }
  }
  // ponytail: no auto-sync. Pulling on a timer would need live two-way sync with every provider; you pull and push with Sync now.
  if (changed) render(); else renderLive();
}

/* ── formatting ── */
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
const ago = t => { const d = Date.now() - t; return d < M ? 'just now' : d < H ? `${Math.floor(d / M)}m ago` : d < D ? `${Math.floor(d / H)}h ago` : `${Math.floor(d / D)}d ago`; };

/* markdown: where the item sits in the file, derived the same way the parser reads it */
function mdLines() {
  const out = ['# billing-svc backlog', ''];
  for (const col of COLS) {
    out.push(`## ${col.id}`);
    for (const c of inCol(col.id)) {
      out.push(`- **${c.title}** ${mdAttrs(c)}${c.body ? ' — ' + c.body.split('. ')[0].replace(/\.$/, '') : ''}`);
      if (c.context) out.push(`  - context: ${c.context.file}`);
    }
    out.push('');
  }
  return out;
}
function mdAttrs(c) { return `{#${c.k} .${c.type}${c.parent ? ' parent=' + c.parent : ''}}`; }
function mdLine(c) { return mdLines().findIndex(l => l.includes(mdAttrs(c))) + 1; }

/* ── input ── */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.card) { st.sel = d.card; st.open = d.card; const c = card(d.card); c.remote = null; st.colCur = COL[c.col].i; render(); return; }
  if (d.close !== undefined) { st.open = null; render(); return; }
  if (d.sync !== undefined) return syncNow();
  if (d.q !== undefined) { st.qOpen = !st.qOpen; render(); return; }
  if (d.fix !== undefined) { st.sync.reject = false; st.sync.state = 'ok'; syncNow(); return; }
  if (d.keep) return resolve(d.keep, true);
  if (d.take) return resolve(d.take, false);
  if (d.to && st.open) return move(card(st.open), d.to);
  if (d.start !== undefined) return startRun(card(st.open));
  if (d.approve !== undefined) return approve(card(st.open));
  if (d.analyst !== undefined) { card(st.open).analyst = Date.now(); toast('repo-analyst is reading src/ and docs/adr/ · read-only'); render(); return; }
  if (d.agents !== undefined) return toggleAgents();
  if (d.prov) { load(d.prov); render(); toast(`Issue provider: ${P().name}`); return; }
  if (d.reject !== undefined) { st.sync.reject = !st.sync.reject; if (!st.sync.reject && st.sync.state === 'error') st.sync.state = 'ok'; render(); toast(st.sync.reject ? 'The next sync will fail' : 'The next sync will go through'); return; }
  if (d.ext !== undefined) {
    if (card('proxy-signature')) { toast('Already added — the board reloaded BACKLOG.md on save'); return; }
    const c = { ...INBOUND[0].card, col: 'backlog', triage: null, by: 'you', created: Date.now(), hist: [{ at: Date.now(), who: 'you', what: 'added in your editor', cmd: 'BACKLOG.md · new bullet under ## backlog' }], fresh: true, remote: 'added to BACKLOG.md in your editor' };
    st.cards.push(c); st.mdLast = Date.now(); render(); toast('BACKLOG.md changed on disk · 1 new item, nothing to sync'); return;
  }
});

/* drag: native, and only where it's honest */
let dragK = null;

document.addEventListener('dragover', e => {

  document.querySelectorAll('.is-over,.is-refuse').forEach(n => { if (n !== col) n.classList.remove('is-over', 'is-refuse'); });
  const no = canMove(card(dragK), col.dataset.col);
  if (!no) { e.preventDefault(); col.classList.add('is-over'); } else if (no !== 'same') col.classList.add('is-refuse');
});

  const colCards = () => inCol(COLS[st.colCur].id);
  const k = e.key;
  if (k === 'h' || k === 'ArrowLeft' || k === 'l' || k === 'ArrowRight') {
    const step = k === 'h' || k === 'ArrowLeft' ? -1 : 1;
    let i = st.colCur + step;
    while (i >= 0 && i < COLS.length && !shown(COLS[i].id)) i += step;
    if (i < 0 || i >= COLS.length) return;
    st.colCur = i;
    const cc = colCards(); st.sel = cc.length ? cc[0].k : null; if (st.open) st.open = st.sel; render(); e.preventDefault();
  } else if (k === 'j' || k === 'ArrowDown' || k === 'k' || k === 'ArrowUp') {
    const cc = colCards(); if (!cc.length) return;
    const i = Math.max(0, cc.findIndex(c => c.k === st.sel));
    st.sel = cc[Math.min(cc.length - 1, Math.max(0, i + (k === 'j' || k === 'ArrowDown' ? 1 : -1)))].k;
    if (st.open) st.open = st.sel; render(); e.preventDefault();
  } else if (k === 'Enter' && st.sel && !e.target.closest('button')) { st.open = st.sel; card(st.sel).remote = null; render(); }
  else if ((k === '[' || k === ']') && st.sel) {
    const c = card(st.sel); let i = COL[c.col].i, step = k === '[' ? -1 : 1;
    do { i += step; } while (i >= 0 && i < COLS.length && !human(COLS[i].id));
    if (i < 0 || i >= COLS.length) return;
    if (move(c, COLS[i].id)) { st.colCur = i; render(); }
  }
  else if (k === 'v') toggleAgents();
  else if (k === 's') syncNow();
  else if (k === 'a' && st.open) approve(card(st.open));
  else if (k === 'Escape') { if (st.open) { st.open = null; render(); } }
});

function toggleAgents() {
  st.showAgent = !st.showAgent;
  // the cursor can't sit in a column that just disappeared
  if (!shown(COLS[st.colCur].id)) { st.colCur = 0; if (st.sel && !shown(card(st.sel).col)) st.sel = null; }
  if (st.open && !shown(card(st.open).col)) st.open = null;
  render();
}

load('gh');
render();
setInterval(tick, 250);
</script>
