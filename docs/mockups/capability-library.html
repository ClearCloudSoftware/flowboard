<meta charset="utf-8">
<title>FlowBoard Capability Library</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FBFAF7; --surface:#FFFFFF; --surface-2:#F4F2EC; --surface-3:#EDEAE1;
  --line:#E4E1D8; --line-2:#CFCBBE;
  --ink:#17171C; --ink-2:#55535C; --ink-3:#7A7880;
  --run:#0E6E74; --run-soft:#0E6E7414;
  --wait:#A35A00; --wait-soft:#A35A0014; --wait-wash:#F7EAD3; --wait-edge:#DCC49A;
  --wait-ink:#FDF6EA; --wait-ink-2:#F8E8D0;
  --fail:#B0231B; --fail-soft:#B0231B12; --fail-edge:#EBD0CC;
  --done:#B8B4A8; --pend:#EAE7DE;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
  --t:150ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--mono);
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;border-radius:0}
:focus-visible{outline:2px solid var(--run);outline-offset:-2px}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.sans{font-family:var(--sans)}
.sep{color:var(--line-2);padding:0 .45em}
.sp{flex:1}
.app{height:100dvh;display:flex;flex-direction:column}

/* ── topbar ───────────────────────────────────────────────────── */
.topbar{flex-shrink:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:600;white-space:nowrap}
.brand em{font-style:normal;color:var(--line-2);padding:0 .35em}
.brand span{color:var(--ink-2);font-weight:400}
.act{border:1px solid var(--line-2);padding:3px 11px;font-size:12px;white-space:nowrap;
  transition:background var(--t),border-color var(--t),color var(--t)}
.act:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink-3)}
.act:disabled{opacity:.4;cursor:default}
.act.primary{border-color:var(--run);color:var(--run);background:var(--run-soft);font-weight:500}
.act.primary:hover:not(:disabled){background:var(--run);color:#fff}
.act.danger:hover:not(:disabled){border-color:var(--fail);color:var(--fail);background:var(--fail-soft)}
.act.warn{border-color:var(--wait);color:var(--wait);background:var(--wait-soft);font-weight:500}
.act.warn:hover{background:var(--wait);color:#fff}

.body{flex:1;min-height:0;display:grid;grid-template-columns:306px 1fr}
.pane{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}
.pane+.pane{border-left:1px solid var(--line-2)}
.ph{flex-shrink:0;display:flex;align-items:center;gap:9px;padding:8px 12px;
  background:var(--surface-3);border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:5}

/* ── rail ─────────────────────────────────────────────────────── */
.cl-search{flex-shrink:0;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.cl-search input{width:100%;padding:5px 9px;border:1px solid var(--line-2);background:var(--paper);font-size:12px}
.cl-filters{flex-shrink:0;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;gap:7px}
.cl-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cl-chips .lbl{flex:0 0 52px}
.chip{padding:2px 8px;font-size:11px;color:var(--ink-2);border:1px solid transparent;transition:all var(--t)}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:500}
.chip u{text-decoration:none;color:var(--ink-3);margin-left:5px}
.chip[aria-pressed="true"] u{color:var(--wait-ink-2)}
.cl-list{flex:1}
.cl-gh{padding:8px 12px 5px;background:var(--surface-2);border-bottom:1px solid var(--line);
  border-top:1px solid var(--line);position:sticky;top:33px;z-index:4}
.cl-row{display:grid;grid-template-columns:1fr auto;gap:2px 9px;width:100%;
  padding:8px 12px;border-bottom:1px solid var(--line);transition:background var(--t)}
.cl-row:hover{background:var(--surface)}
.cl-row.on{background:var(--surface);box-shadow:inset 2px 0 0 var(--ink)}
.cl-nm{font-weight:500;font-size:13px;display:flex;align-items:center;gap:7px;min-width:0}
.cl-nm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-sub{grid-column:1/3;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-meta{font-size:11px;color:var(--ink-3);white-space:nowrap}
.dot{width:6px;height:6px;flex:0 0 auto;background:var(--done)}
.dot.up{background:var(--wait)}
.dot.orphan{background:var(--line-2);box-shadow:inset 0 0 0 1px var(--line-2);background:transparent}

/* ── provider marks ───────────────────────────────────────────── */
.pv{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:1px 6px;
  border:1px solid var(--line-2);color:var(--ink-3);white-space:nowrap}
.pv.has{border-color:var(--run);color:var(--run);background:var(--run-soft)}
.pv.none{border-style:dashed}

/* ── detail ───────────────────────────────────────────────────── */
.dt{padding:16px 18px 50px;max-width:820px}
.dt-h{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.dt-h h1{font-family:var(--mono);font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.dt-kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  padding:2px 7px;border:1px solid var(--ink-3);color:var(--ink-2)}
.dt-kind.skill{border-color:var(--run);color:var(--run);background:var(--run-soft)}
.dt-kind.agent{border-color:var(--ink);color:var(--ink)}
.dt-kind.pack{border-color:var(--wait);color:var(--wait);background:var(--wait-soft)}
.dt-desc{font-family:var(--sans);font-size:14.5px;color:var(--ink-2);margin:9px 0 0;max-width:70ch}
.dt-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.dt-b{margin-top:22px}
.dt-b>.lbl{display:block;margin-bottom:7px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:5px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;color:var(--ink-2)}
.kv dd b{color:var(--ink);font-weight:500}
.pvrow{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;
  padding:8px 10px;border:1px solid var(--line);background:var(--surface)}
.pvrow+.pvrow{border-top:0}
.pvrow.missing{background:var(--surface-2);color:var(--ink-3)}
.pvrow .n{font-weight:500}
.pvrow .d{font-size:11.5px;font-family:var(--sans)}
.code{background:var(--surface-2);border:1px solid var(--line);padding:9px 11px;
  font-size:12px;line-height:1.7;overflow-x:auto;white-space:pre}
.code .k{color:var(--ink-3)} .code .s{color:var(--run)} .code .w{color:var(--wait)}
.tool{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;
  border:1px solid var(--line-2);background:var(--surface-2);margin:0 5px 5px 0}
.tool.net{border-color:var(--wait);color:var(--wait);background:var(--wait-soft)}
.used{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:baseline;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.used:last-child{border-bottom:0}
.used .f{color:var(--ink-2)}
.used .f b{color:var(--ink);font-weight:500}
.used .s{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.empty{font-family:var(--sans);font-size:13px;color:var(--ink-3)}
.callout{border-left:3px solid var(--wait);background:var(--wait-wash);padding:10px 13px;
  font-family:var(--sans);font-size:13.5px;margin-top:12px;max-width:74ch}
.callout.bad{border-left-color:var(--fail);background:var(--fail-soft)}
.callout.ok{border-left-color:var(--run);background:var(--run-soft)}
.callout b{font-weight:600}
.inner{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.inner span{font-size:11.5px;border:1px solid var(--line);background:var(--surface-2);padding:1px 7px}

/* ── install overlay ──────────────────────────────────────────── */
.ov{position:fixed;inset:0;background:rgba(23,23,28,.42);display:flex;
  align-items:flex-start;justify-content:center;padding:60px 18px;z-index:60}
.iv{background:var(--surface);border:1px solid var(--line-2);width:100%;max-width:640px;
  max-height:calc(100dvh - 120px);display:flex;flex-direction:column;overflow:hidden}
.iv-h{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--surface-3);border-bottom:1px solid var(--line-2)}
.iv-b{padding:14px;overflow:auto}
.iv-f{flex-shrink:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:10px 14px;background:var(--surface-2);border-top:1px solid var(--line)}
.iv-url{display:flex;gap:7px}
.iv-url input{flex:1;padding:6px 9px;border:1px solid var(--line-2);background:var(--paper);font-size:12px}
.steps{display:flex;flex-direction:column;gap:0;margin-top:12px}
.stp{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:baseline;padding:5px 0;font-size:12.5px}
.stp .i{display:inline-flex;color:var(--line-2)}
.stp.done .i{color:var(--run)}
.stp.run .i{color:var(--run)}
.stp.wait{color:var(--ink-3)}
.spin{display:inline-block;width:10px;height:10px;border:1.6px solid var(--run);
  border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.statusbar{flex-shrink:0;display:flex;align-items:center;flex-wrap:wrap;
  padding:6px 16px;background:var(--surface-2);border-top:1px solid var(--line);
  color:var(--ink-3);font-size:11px}
.statusbar b{color:var(--ink-2);font-weight:500}
.kbd{border:1px solid var(--line-2);padding:0 4px;font-size:10px;color:var(--ink-2);background:var(--surface)}

@media (max-width:900px){
  .body{grid-template-columns:1fr}
  .pane.rail{max-height:38vh}
  .pane+.pane{border-left:0;border-top:1px solid var(--line-2)}
}
@media (prefers-reduced-motion:reduce){
  *,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">flowboard<em>/</em><span>library</span></div>
    <span class="lbl" id="counts"></span>
    <span class="sp"></span>
    <button class="act" id="defineAgent">+ Define agent</button>
    <button class="act primary" id="openInstall">+ Install from GitHub</button>
  </header>

  <div class="body">
    <aside class="pane rail">
      <div class="ph"><span class="lbl">capabilities</span><span class="sp"></span><span class="lbl" id="shown"></span></div>
      <div class="cl-search"><input id="q" placeholder="Search capabilities and authors…" autocomplete="off" aria-label="Search"></div>
      <div class="cl-filters">
        <div class="cl-chips"><span class="lbl">kind</span><span id="kinds"></span></div>
        <div class="cl-chips"><span class="lbl">provider</span><span id="provs"></span></div>
      </div>
      <div class="cl-list" id="list"></div>
    </aside>
    <main class="pane"><div id="detail"></div></main>
  </div>

  <footer class="statusbar" id="sb"></footer>
</div>
<div id="overlay"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON = {
  done:'<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 8.3l3.1 3.1 6.1-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  dash:'<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  warn:'<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.6L14.6 13.4H1.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.6v3.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.5" r=".9" fill="currentColor"/></svg>',
  up  :'<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.5V4M4.4 7.2L8 3.5l3.6 3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const PROVIDERS = [['claude','Claude Code'], ['codex','Codex CLI']];

/* ══ the library ═══════════════════════════════════════════════════════
   A capability is the logical thing; a pack is one packaging of it for
   one provider. Same capability, one pack per provider.                */
const C = (o) => o;
const LIB = [
  C({ id:'code-review', kind:'skill', author:'@flowboard/core', seeded:true,
    desc:'Read the diff against the plan, then call set_outcome with a verdict and its reasoning.',
    packs:{ claude:{ ver:'2.1', at:'12 Sep' }, codex:{ ver:'0.4', at:'14 Sep' } },
    src:'github.com/flowboard/capabilities', commit:'a91c4f2',
    command:'/code-review', tools:['Read','Grep'],
    manifest:[['k','name:'],['s','code-review'],['k','\ndescription:'],['','Review a diff against the plan it came from.'],
              ['k','\ninvokes:'],['s','set_outcome'],['k','\nallowed-tools:'],['','Read, Grep']],
    used:[['Software delivery','@core v4','review'],['Code review','@core v7','review'],
          ['Code review','@team-sec v2','review'],['Test and triage','@core v4','triage']] }),
  C({ id:'grill-me', kind:'skill', author:'@flowboard/core', seeded:true,
    desc:'Pose a batch of questions in one go and honour no_answer_yet so the run parks instead of hanging.',
    packs:{ claude:{ ver:'1.4', at:'12 Sep' } },
    src:'github.com/flowboard/capabilities', commit:'a91c4f2',
    command:'/grill-me', tools:['Read'],
    manifest:[['k','name:'],['s','grill-me'],['k','\ndescription:'],['','Batch open questions to the operator.'],
              ['k','\ninvokes:'],['s','ask_user_batch'],['k','\nhonours:'],['s','no_answer_yet']],
    used:[['Discovery to stories','@core v3','elicit'],['Story refinement','@core v5','refine']] }),
  C({ id:'plan-implementation', kind:'skill', author:'@flowboard/core', seeded:true,
    desc:'Turn a research brief into numbered work items, each with an acceptance criterion.',
    packs:{ claude:{ ver:'3.0', at:'12 Sep' }, codex:{ ver:'1.1', at:'14 Sep' } },
    src:'github.com/flowboard/capabilities', commit:'a91c4f2',
    command:'/plan-implementation', tools:['Read','Write'],
    manifest:[['k','name:'],['s','plan-implementation'],['k','\ndescription:'],['','Brief in, numbered plan out.'],
              ['k','\nproduces:'],['s','plan.md'],['k','\nallowed-tools:'],['','Read, Write']],
    used:[['Software delivery','@core v4','plan'],['Software delivery','@alex v2','plan'],
          ['Code review','@team-sec v2','plan'],['Design handoff','@core v2','plan'],['Test and triage','@core v4','plan']] }),
  C({ id:'secret-scan', kind:'skill', author:'@team-sec',
    desc:'Sweep the diff for credentials, tokens and private keys before a human ever reads it.',
    packs:{ claude:{ ver:'1.3', at:'2 Sep' } }, update:{ ver:'1.5',
      note:'Adds detection for cloud provider session tokens, and stops flagging example keys in docs.' },
    src:'github.com/team-sec/fb-secret-scan', commit:'7d3e0b1',
    command:'/secret-scan', tools:['Read','Grep'],
    manifest:[['k','name:'],['s','secret-scan'],['k','\ndescription:'],['','Find credentials in a diff.'],
              ['k','\ninvokes:'],['s','set_outcome'],['k','\nallowed-tools:'],['','Read, Grep']],
    used:[['Code review','@team-sec v2','secret-scan'],['Incident response','@team-sec v3','triage']] }),
  C({ id:'threat-model', kind:'skill', author:'@team-sec',
    desc:'Draw the trust boundaries a change crosses and name what an attacker gains at each one.',
    packs:{ claude:{ ver:'1.0', at:'2 Sep' } },
    src:'github.com/team-sec/fb-threat-model', commit:'4a8811c',
    command:'/threat-model', tools:['Read','Grep'],
    manifest:[['k','name:'],['s','threat-model'],['k','\ndescription:'],['','Trust boundaries and attacker gains.'],
              ['k','\nproduces:'],['s','threats.md']],
    used:[['Code review','@team-sec v2','threat-model']] }),
  C({ id:'domain-model', kind:'skill', author:'@alex',
    desc:'Turn a transcript into entities, events and the invariants that must hold between them.',
    packs:{ claude:{ ver:'0.3', at:'8 Sep' } },
    src:'github.com/alex/fb-domain-model', commit:'2f19ade',
    command:'/domain-model', tools:['Read','Write'],
    manifest:[['k','name:'],['s','domain-model'],['k','\ndescription:'],['','Entities, events, invariants.'],
              ['k','\nproduces:'],['s','domain.md']],
    used:[['Domain modelling','@alex v1','model']] }),
  C({ id:'release-notes', kind:'skill', author:'@growth',
    desc:'Draft user-facing release notes from a set of merged summaries.',
    packs:{ claude:{ ver:'0.9', at:'20 Aug' } },
    src:'github.com/growth/fb-release-notes', commit:'ce40772',
    command:'/release-notes', tools:['Read','Write'],
    manifest:[['k','name:'],['s','release-notes'],['k','\ndescription:'],['','Summaries in, release notes out.']],
    used:[] }),

  C({ id:'architect', kind:'agent', author:'@flowboard/core', seeded:true,
    desc:'Plans before it types. Reads the brief and the codebase, writes numbered work items, never edits code.',
    packs:{ claude:{ ver:'—', at:'12 Sep' }, codex:{ ver:'—', at:'12 Sep' } },
    model:'opus', effort:'high', tools:['Read','Grep','Write'],
    prompt:'You plan implementations. Read the brief and the existing code, then write a numbered plan where every item has an acceptance criterion someone else could check. You do not edit source files.',
    used:[['Software delivery','@core v4','plan'],['Software delivery','@alex v2','plan'],['Design handoff','@core v2','plan']] }),
  C({ id:'developer', kind:'agent', author:'@flowboard/core', seeded:true,
    desc:'Implements one plan item at a time and stops when the acceptance criterion is met.',
    packs:{ claude:{ ver:'—', at:'12 Sep' }, codex:{ ver:'—', at:'12 Sep' } },
    model:'opus', effort:'high', tools:['Read','Write','Edit','Bash'],
    prompt:'You implement the plan you are given, item by item. If an item cannot be built, say so in your output and move on rather than inventing a substitute.',
    used:[['Software delivery','@core v4','build'],['Software delivery','@alex v2','build'],
          ['Code review','@team-sec v2','implement'],['Release and rollback','@core v6','deploy']] }),
  C({ id:'reviewer', kind:'agent', author:'@flowboard/core', seeded:true,
    desc:'Compares the diff to the plan and reports a verdict with its reasoning. Reads only.',
    packs:{ claude:{ ver:'—', at:'12 Sep' }, codex:{ ver:'—', at:'14 Sep' } },
    model:'sonnet', effort:'medium', tools:['Read','Grep'],
    prompt:'You review a change against the plan it came from. Report each plan item as met, deviated or missing, and say which files are the evidence.',
    used:[['Software delivery','@core v4','review'],['Code review','@core v7','review'],
          ['Code review','@team-sec v2','review'],['Test and triage','@core v4','sign-off']] }),
  C({ id:'tester', kind:'agent', author:'@flowboard/core', seeded:true,
    desc:'Writes and runs tests against the acceptance criteria, and reports coverage gaps rather than hiding them.',
    packs:{ claude:{ ver:'—', at:'12 Sep' } },
    model:'sonnet', effort:'medium', tools:['Read','Write','Bash'],
    prompt:'You write tests for the acceptance criteria in the plan. If a criterion cannot be tested, name it explicitly in your report.',
    used:[['Software delivery','@core v4','tests'],['Software delivery','@alex v2','tests'],['Test and triage','@core v4','execute']] }),
  C({ id:'scout', kind:'agent', author:'@flowboard/core', seeded:true,
    desc:'Reads widely and cheaply, then condenses. The first step of most flows.',
    packs:{ claude:{ ver:'—', at:'12 Sep' }, codex:{ ver:'—', at:'12 Sep' } },
    model:'haiku', effort:'low', tools:['Read','Grep','WebFetch'],
    prompt:'You research. Read what is relevant, then write a short brief with findings and open questions. Prefer reading over guessing.',
    used:[['Software delivery','@core v4','research'],['Discovery to stories','@core v3','elicit'],
          ['Domain modelling','@alex v1','research'],['Positioning sprint','@growth v1','interview'],
          ['Launch campaign','@growth v4','research']] }),
  C({ id:'sec-analyst', kind:'agent', author:'@team-sec',
    desc:'Reasons about trust boundaries and attacker capability. Reads only, never changes anything.',
    packs:{ claude:{ ver:'—', at:'2 Sep' } },
    model:'sonnet', effort:'high', tools:['Read','Grep'],
    prompt:'You analyse security impact. For each trust boundary the change crosses, state what an attacker gains if it fails.',
    used:[['Code review','@team-sec v2','threat-model']] }),
  C({ id:'scribe', kind:'agent', author:'@flowboard/core', seeded:true,
    desc:'Writes the closing summary: what changed, what it cost, what to know next time.',
    packs:{ claude:{ ver:'—', at:'12 Sep' } },
    model:'haiku', effort:'low', tools:['Read','Write'],
    prompt:'You summarise a finished task in under 200 words: what shipped, what did not, and anything the next task should know.',
    used:[['Software delivery','@core v4','summarize'],['Story refinement','@core v5','publish'],
          ['Launch campaign','@core v2','measure'],['Release and rollback','@core v6','notify']] }),

  C({ id:'Delivery pack', kind:'pack', author:'@flowboard/core', seeded:true,
    desc:'The starter set. Everything the built-in software pipeline needs, installed as one unit.',
    packs:{ claude:{ ver:'1.0', at:'12 Sep' }, codex:{ ver:'0.5', at:'14 Sep' } },
    src:'github.com/flowboard/capabilities', commit:'a91c4f2',
    contains:{ skills:['code-review','grill-me','plan-implementation'],
               agents:['architect','developer','reviewer','tester','scout','scribe'],
               flows:['Software delivery','Code review'] },
    used:[['Software delivery','@core v4','—'],['Code review','@core v7','—']] }),
  C({ id:'Security pack', kind:'pack', author:'@team-sec',
    desc:'What the security team expects on anything touching auth or payments.',
    packs:{ claude:{ ver:'2.0', at:'2 Sep' } },
    src:'github.com/team-sec/fb-security-pack', commit:'7d3e0b1',
    contains:{ skills:['secret-scan','threat-model'], agents:['sec-analyst'],
               flows:['Code review','Incident response'] },
    used:[['Code review','@team-sec v2','—'],['Incident response','@team-sec v3','—']] }),
  C({ id:'Marketing pack', kind:'pack', author:'@growth',
    desc:'Positioning, content and launch, with the channel briefs the growth team uses.',
    packs:{ claude:{ ver:'1.2', at:'20 Aug' } },
    src:'github.com/growth/fb-marketing-pack', commit:'ce40772',
    contains:{ skills:['release-notes'], agents:['scout','scribe'],
               flows:['Launch campaign','Positioning sprint'] },
    used:[['Launch campaign','@growth v4','—']] }),
];

/* what a fresh clone from GitHub turns out to contain */
const CANDIDATE = {
  url:'https://github.com/acme-sec/fb-dependency-audit',
  id:'dependency-audit', kind:'skill', author:'@acme-sec',
  desc:'Audit the dependency tree for known advisories and versions that are not pinned.',
  packs:{ claude:{ ver:'1.0.2', at:'just now' } },
  src:'github.com/acme-sec/fb-dependency-audit', commit:'b62f10d',
  command:'/dependency-audit', tools:['Read','Bash','WebFetch'],
  manifest:[['k','name:'],['s','dependency-audit'],['k','\nversion:'],['','1.0.2'],
            ['k','\ndescription:'],['','Audit dependencies for advisories and unpinned versions.'],
            ['k','\ninvokes:'],['s','set_outcome'],
            ['k','\nallowed-tools:'],['','Read, Bash, '],['w','WebFetch']],
  used:[],
};
const NET_TOOLS = new Set(['WebFetch','WebSearch','Bash']);

let kind = 'all', prov = 'all', query = '', sel = 'code-review';
let install = null;   // { stage, url }

/* ══ derived ═══════════════════════════════════════════════════════════ */
const KINDS = [['all','All'], ['skill','Skills'], ['agent','Agents'], ['pack','Packs']];
const byId = id => LIB.find(c => c.id === id);
const nProv = c => Object.keys(c.packs).length;
function shown(){
  return LIB.filter(c =>
    (kind === 'all' || c.kind === kind) &&
    (prov === 'all' || c.packs[prov]) &&
    (!query || (c.id + ' ' + c.author + ' ' + c.desc).toLowerCase().includes(query)));
}
/* a capability with no Claude pack cannot run on a Claude step, and vice versa */
function gaps(c){
  const out = [];
  for (const [p, label] of PROVIDERS) if (!c.packs[p]) out.push(label);
  return out;
}

/* ══ rail ══════════════════════════════════════════════════════════════ */
function drawRail(){
  $('#kinds').innerHTML = KINDS.map(([k, l]) => {
    const n = k === 'all' ? LIB.length : LIB.filter(c => c.kind === k).length;
    return `<button class="chip" data-kind="${k}" aria-pressed="${kind === k}">${l}<u>${n}</u></button>`;
  }).join('');
  $('#provs').innerHTML = [['all','Any']].concat(PROVIDERS).map(([p, l]) => {
    const n = p === 'all' ? LIB.length : LIB.filter(c => c.packs[p]).length;
    return `<button class="chip" data-prov="${p}" aria-pressed="${prov === p}">${l}<u>${n}</u></button>`;
  }).join('');

  const list = shown();
  $('#shown').textContent = `${list.length} shown`;
  let html = '', last = null;
  for (const c of list) {
    if (c.kind !== last) {
      last = c.kind;
      html += `<div class="cl-gh lbl">${{skill:'skills',agent:'agents',pack:'packs'}[c.kind]}</div>`;
    }
    const dot = c.update ? 'up' : c.used.length ? '' : 'orphan';
    html += `<button class="cl-row${sel === c.id ? ' on' : ''}" data-sel="${esc(c.id)}">
      <span class="cl-nm"><span class="dot ${dot}" title="${c.update ? 'update available' : c.used.length ? 'in use' : 'not used by any flow'}"></span><b>${esc(c.id)}</b></span>
      <span class="cl-meta">${c.author}</span>
      <span class="cl-sub">${esc(c.desc)}</span>
      <span class="cl-meta">${Object.keys(c.packs).join(' · ')}<span class="sep">·</span>${c.used.length} use${c.used.length === 1 ? '' : 's'}</span>
    </button>`;
  }
  $('#list').innerHTML = html || `<div class="empty" style="padding:26px 14px;text-align:center">Nothing matches. Clear the search or widen the filters.</div>`;
}

/* ══ detail ════════════════════════════════════════════════════════════ */
function drawDetail(){
  const c = byId(sel);
  if (!c) { $('#detail').innerHTML = `<div class="empty" style="padding:40px;text-align:center">Select a capability.</div>`; return; }
  const miss = gaps(c);
  const blocked = c.used.length > 0;

  $('#detail').innerHTML = `<div class="dt">
    <div class="dt-h">
      <h1>${esc(c.id)}</h1>
      <span class="dt-kind ${c.kind}">${c.kind}</span>
      <span class="lbl" style="letter-spacing:.04em">${c.author}${c.seeded ? ' · ships with FlowBoard' : ''}</span>
    </div>
    <p class="dt-desc">${esc(c.desc)}</p>

    <div class="dt-acts">
      ${c.update ? `<button class="act warn" id="doUpdate">${ICON.up} Update to ${c.update.ver}</button>` : ''}
      ${c.src ? `<button class="act">Open on GitHub</button>` : ''}
      <button class="act${blocked ? '' : ' danger'}" id="doRemove"${blocked ? ' disabled' : ''}>Remove</button>
      ${blocked ? `<span class="lbl" style="align-self:center;letter-spacing:.02em;text-transform:none">in use by ${c.used.length} step${c.used.length === 1 ? '' : 's'} — can't be removed</span>` : ''}
    </div>

    ${c.update ? `<div class="callout"><b>${c.update.ver} is available.</b> ${esc(c.update.note)}
      Updating replaces the installed pack for every flow that draws on it — flows are not pinned to a
      capability version the way tasks are pinned to a flow version.</div>` : ''}

    <div class="dt-b"><span class="lbl">packs — one packaging per provider</span>
      ${PROVIDERS.map(([p, label]) => {
        const k = c.packs[p];
        return `<div class="pvrow${k ? '' : ' missing'}">
          <span class="n">${label}</span>
          <span class="d">${k ? `installed${k.ver !== '—' ? ' <b>v' + k.ver + '</b>' : ''} · ${k.at}`
            : 'not packaged for this provider'}</span>
          <span class="pv ${k ? 'has' : 'none'}">${k ? ICON.done : ICON.dash}${p}</span></div>`;
      }).join('')}
      ${miss.length ? `<div class="callout">${ICON.warn} <b>No ${miss.join(' or ')} pack.</b>
        A step set to run on ${miss[0]} can't use this — the flow editor refuses to save that combination,
        because a pack's provider has to match the step's.</div>`
        : `<div class="callout ok">${ICON.done} <b>Packaged for both providers.</b> Any step can use it,
        whichever agent CLI it runs on.</div>`}
    </div>

    ${c.kind === 'agent' ? `
      <div class="dt-b"><span class="lbl">defaults</span>
        <dl class="kv"><dt>model</dt><dd><b>${c.model}</b> <span style="color:var(--ink-3)">(logical id — the adapter maps it)</span></dd>
          <dt>effort</dt><dd><b>${c.effort}</b></dd></dl></div>
      <div class="dt-b"><span class="lbl">prompt</span>
        <div class="code" style="white-space:pre-wrap;font-family:var(--sans);font-size:13.5px;line-height:1.55">${esc(c.prompt)}</div></div>`
    : c.kind === 'pack' ? `
      <div class="dt-b"><span class="lbl">contains</span>
        ${['skills','agents','flows'].map(k => `<div style="margin-bottom:9px">
          <span class="lbl" style="letter-spacing:.06em">${k}</span>
          <div class="inner">${c.contains[k].map(x => `<span>${esc(x)}</span>`).join('')}</div></div>`).join('')}
        <p class="empty" style="margin-top:4px">Installing the pack installs all of it. Removing it leaves
        anything a flow still draws on.</p></div>`
    : `
      <div class="dt-b"><span class="lbl">SKILL.md</span>
        <div class="code">${c.manifest.map(([k, t]) => `<span class="${k}">${esc(t)}</span>`).join('')}</div>
        <dl class="kv" style="margin-top:10px"><dt>invoked as</dt><dd><b>${esc(c.command)}</b></dd>
          <dt>format</dt><dd>Claude plugin dir — <span style="color:var(--ink-3)">.claude-plugin/plugin.json + skills/${esc(c.id)}/SKILL.md</span></dd></dl></div>`}

    ${c.tools ? `<div class="dt-b"><span class="lbl">tools it may use</span>
      <div>${c.tools.map(t => `<span class="tool${NET_TOOLS.has(t) ? ' net' : ''}">${NET_TOOLS.has(t) ? ICON.warn : ''}${t}</span>`).join('')}</div>
      ${c.tools.some(t => NET_TOOLS.has(t)) ? `<p class="empty" style="margin-top:6px">Amber tools can reach
        outside the workspace. Egress is default-deny, so a step using this still needs the host on its
        allowlist — installing the capability does not open the wall.</p>` : ''}</div>` : ''}

    ${c.src ? `<div class="dt-b"><span class="lbl">source</span>
      <dl class="kv"><dt>repository</dt><dd>${esc(c.src)}</dd>
        <dt>commit</dt><dd><b>${c.commit}</b></dd></dl></div>` : ''}

    <div class="dt-b"><span class="lbl">used by — steps draw on these</span>
      ${c.used.length ? c.used.map(([f, v, s]) => `<div class="used">
        <span class="f"><b>${esc(f)}</b> <span style="color:var(--ink-3)">${esc(v)}</span></span>
        <span class="s">${s === '—' ? 'whole pack' : 'step ' + esc(s)}</span></div>`).join('')
        : `<div class="callout"><b>Nothing uses this.</b> No step in any flow references it, so removing it
           is safe — and leaving it installed is just clutter in the step editor's picker.</div>`}
    </div>
  </div>`;
}

/* ══ install overlay ═══════════════════════════════════════════════════ */
const STAGES = [
  ['clone','git clone into the capability store'],
  ['parse','read .claude-plugin/plugin.json and skills/*/SKILL.md'],
  ['check','check the tools it asks for, and which providers it packages'],
];
function drawOverlay(){
  if (!install) { $('#overlay').innerHTML = ''; return; }
  const { stage } = install;
  const at = ['url','clone','parse','check','ready'].indexOf(stage);
  const c = CANDIDATE;
  $('#overlay').innerHTML = `<div class="ov" id="ovBg"><div class="iv" role="dialog" aria-label="Install from GitHub">
    <div class="iv-h"><span class="lbl">install from github</span><span class="sp"></span>
      <button class="act" id="ovClose">Close</button></div>
    <div class="iv-b">
      <form class="iv-url" id="urlForm">
        <input id="urlInput" value="${esc(install.url)}" placeholder="https://github.com/…" autocomplete="off"
          ${stage === 'url' ? '' : 'readonly'} aria-label="Repository URL">
        <button class="act primary" type="submit"${stage === 'url' ? '' : ' disabled'}>Fetch</button>
      </form>
      ${stage === 'url' ? `<p class="empty" style="margin-top:12px">FlowBoard clones the repository into its
        capability store, reads the manifest, and shows you what it found before anything is installed.</p>`
      : `<div class="steps">${STAGES.map(([k, d], i) => {
          const done = at > i + 1, running = at === i + 1;
          return `<div class="stp ${done ? 'done' : running ? 'run' : 'wait'}">
            <span class="i">${done ? ICON.done : running ? '<span class="spin"></span>' : ICON.dash}</span>
            <span>${d}</span></div>`;
        }).join('')}</div>`}

      ${stage === 'ready' ? `
        <div class="dt-b"><span class="lbl">found</span>
          <dl class="kv"><dt>name</dt><dd><b>${esc(c.id)}</b></dd>
            <dt>version</dt><dd>${c.packs.claude.ver}</dd>
            <dt>kind</dt><dd>skill <span style="color:var(--ink-3)">(Claude plugin dir)</span></dd>
            <dt>invoked as</dt><dd><b>${esc(c.command)}</b></dd>
            <dt>commit</dt><dd>${c.commit}</dd></dl>
          <p class="dt-desc" style="font-size:13.5px">${esc(c.desc)}</p></div>
        <div class="dt-b"><span class="lbl">SKILL.md</span>
          <div class="code">${c.manifest.map(([k, t]) => `<span class="${k}">${esc(t)}</span>`).join('')}</div></div>
        <div class="dt-b"><span class="lbl">tools it asks for</span>
          <div>${c.tools.map(t => `<span class="tool${NET_TOOLS.has(t) ? ' net' : ''}">${NET_TOOLS.has(t) ? ICON.warn : ''}${t}</span>`).join('')}</div>
          <div class="callout">${ICON.warn} <b>It asks for WebFetch.</b> This capability wants to reach the
          network. Egress stays default-deny — a step using it will still fail closed until you add the host
          it needs to that step's allowlist.</div></div>
        <div class="dt-b"><span class="lbl">providers</span>
          <div class="pvrow"><span class="n">Claude Code</span><span class="d">packaged</span>
            <span class="pv has">${ICON.done}claude</span></div>
          <div class="pvrow missing"><span class="n">Codex CLI</span><span class="d">no pack in this repository</span>
            <span class="pv none">${ICON.dash}codex</span></div></div>` : ''}
    </div>
    <div class="iv-f">
      ${stage === 'ready'
        ? `<button class="act primary" id="doInstall">Install ${esc(c.id)}</button>
           <span class="lbl" style="letter-spacing:.02em;text-transform:none">it becomes selectable in the step editor straight away</span>`
        : `<span class="lbl" style="letter-spacing:.02em;text-transform:none">${
            stage === 'url' ? 'nothing is written until you confirm' : 'reading the repository…'}</span>`}
    </div>
  </div></div>`;
}
function runInstall(url){
  install = { stage:'clone', url };
  drawOverlay();
  const seq = ['parse','check','ready'];
  seq.forEach((s, i) => setTimeout(() => { if (install) { install.stage = s; drawOverlay(); } }, (i + 1) * 700));
}

/* ══ chrome ════════════════════════════════════════════════════════════ */
function drawChrome(){
  const s = LIB.filter(c => c.kind === 'skill').length;
  const a = LIB.filter(c => c.kind === 'agent').length;
  const p = LIB.filter(c => c.kind === 'pack').length;
  const ups = LIB.filter(c => c.update).length;
  const orphan = LIB.filter(c => !c.used.length).length;
  const codex = LIB.filter(c => c.packs.codex).length;
  $('#counts').textContent = `${s} skills · ${a} agents · ${p} packs`;
  $('#sb').innerHTML = `<span><b>${LIB.length}</b> capabilities<span class="sep">·</span>` +
    `<b style="color:${ups ? 'var(--wait)' : 'inherit'}">${ups}</b> update${ups === 1 ? '' : 's'} available<span class="sep">·</span>` +
    `<b>${orphan}</b> used by nothing<span class="sep">·</span>` +
    `codex packs for <b>${codex}</b> of ${LIB.length}<span class="sep">·</span>` +
    `store <b>~/.flowboard/capabilities</b></span>` +
    `<span class="sp"></span><span><span class="kbd">esc</span> close</span>`;
}
const render = () => { drawRail(); drawDetail(); drawChrome(); drawOverlay(); };

/* ══ interaction ═══════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const k = e.target.closest('[data-kind]'); if (k) { kind = k.dataset.kind; return render(); }
  const p = e.target.closest('[data-prov]'); if (p) { prov = p.dataset.prov; return render(); }
  const s = e.target.closest('[data-sel]');  if (s) { sel = s.dataset.sel; return render(); }

  if (e.target.closest('#openInstall')) { install = { stage:'url', url:CANDIDATE.url }; drawOverlay(); $('#urlInput')?.focus(); return; }
  if (e.target.closest('#ovClose') || e.target.id === 'ovBg') { install = null; return drawOverlay(); }
  if (e.target.closest('#doInstall')) {
    LIB.unshift({ ...CANDIDATE });
    install = null; sel = CANDIDATE.id; kind = 'all'; prov = 'all'; query = ''; $('#q').value = '';
    return render();
  }
  if (e.target.closest('#doUpdate')) {
    const c = byId(sel);
    c.packs.claude.ver = c.update.ver; c.packs.claude.at = 'just now';
    c.commit = 'e07b3a9'; delete c.update;
    return render();
  }
  if (e.target.closest('#doRemove')) {
    const c = byId(sel);
    if (c.used.length) return;
    LIB.splice(LIB.indexOf(c), 1);
    sel = LIB[0]?.id ?? null;
    return render();
  }
  if (e.target.closest('#defineAgent')) { sel = 'architect'; kind = 'agent'; return render(); }
});
document.addEventListener('submit', e => {
  if (!e.target.closest('#urlForm')) return;
  e.preventDefault();
  runInstall($('#urlInput').value.trim() || CANDIDATE.url);
});
$('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); drawRail(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && install) { install = null; drawOverlay(); }
});

render();
</script>
